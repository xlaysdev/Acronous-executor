name: DLL static analysis

on:
  push:
    paths:
      - "*.dll"
      - "analysis/input/**/*.dll"
      - "analysis/input/*.dll"
      - ".github/workflows/dll-analysis.yml"
      - "scripts/ExportDecompiled.java"
  workflow_dispatch:
    inputs:
      dll_path:
        description: "Repository path to the DLL"
        required: true
        default: "wearedevs.dll"

permissions:
  contents: write

concurrency:
  group: dll-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select input DLL
        id: input
        shell: bash
        env:
          REQUESTED_DLL: ${{ inputs.dll_path }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            DLL="$REQUESTED_DLL"
          else
            DLL=""
            for candidate in wearedevs.dll analysis/input/wearedevs_exploit_api.dll; do
              if [ -f "$candidate" ]; then
                DLL="$candidate"
                break
              fi
            done
            if [ -z "$DLL" ]; then
              DLL="$(find analysis/input -type f -iname '*.dll' -print -quit 2>/dev/null || true)"
            fi
          fi

          if [ -z "$DLL" ] || [ ! -f "$DLL" ]; then
            echo "DLL not found: ${DLL:-<no candidate>}" >&2
            echo "Place a DLL at repository root or under analysis/input/." >&2
            exit 1
          fi

          case "$DLL" in
            /*|*..*)
              echo "DLL path must be a repository-relative path without '..'." >&2
              exit 1
              ;;
          esac

          NAME="$(basename "$DLL")"
          NAME="${NAME%.*}"
          NAME="$(printf '%s' "$NAME" | tr -cs '[:alnum:]_.-' '-')"
          OUTPUT_DIR="analysis/decompiled/$NAME"

          echo "Selected DLL: $DLL"
          echo "dll=$DLL" >> "$GITHUB_OUTPUT"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          mkdir -p "$OUTPUT_DIR"

      - name: Set up Java for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download and verify official Ghidra
        shell: bash
        run: |
          curl -fL --retry 3 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip" \
            -o /tmp/ghidra.zip
          echo "2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67  /tmp/ghidra.zip" | sha256sum -c -
          unzip -q /tmp/ghidra.zip -d /tmp
          echo "GHIDRA_HOME=/tmp/ghidra_12.2_PUBLIC" >> "$GITHUB_ENV"

      - name: Run Ghidra headless analysis and decompiler
        shell: bash
        env:
          DLL_PATH: ${{ steps.input.outputs.dll }}
          OUTPUT_DIR: ${{ steps.input.outputs.output_dir }}
        run: |
          mkdir -p "$OUTPUT_DIR" ghidra-project
          "$GHIDRA_HOME/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra-project" AcronousDLL \
            -import "$GITHUB_WORKSPACE/$DLL_PATH" \
            -analysisTimeoutPerFile 900 \
            -max-cpu 2 \
            -scriptPath "$GITHUB_WORKSPACE/scripts" \
            -postScript ExportDecompiled.java "$GITHUB_WORKSPACE/$OUTPUT_DIR" \
            -postScript ExportMetadata.java "$GITHUB_WORKSPACE/$OUTPUT_DIR"
          {
            echo "Input: $DLL_PATH"
            echo "SHA-256:"
            sha256sum "$DLL_PATH"
            echo
            echo "File identification:"
            file "$DLL_PATH"
          } > "$OUTPUT_DIR/input-info.txt"
          cat > "$OUTPUT_DIR/README.md" <<'EOF'
          # Decompiled output

          Generated automatically by the Acronous Executor DLL static-analysis workflow using Ghidra.

          - `decompiled.c` is the complete aggregate of Ghidra-generated C-like pseudocode.
          - `exports/` contains separate files for recognized exported functions: DllMain, initialize, attach, execute, and isAttached (when Ghidra identifies them by those names).
          - `functions/` contains one `.c` file per successfully decompiled function, named with its function name and address.
          - `decompilation-summary.txt` records function counts and export-file counts.
          - `input-info.txt` records the input file path, SHA-256, and file identification.\n          - `metadata-strings.txt`, `metadata-imports.txt`, and `metadata-xrefs.txt` export defined strings, imported symbols, and cross-references for selected globals.

          This is decompiler-generated pseudocode, not the original source. Names, types, and control flow are reverse-engineering interpretations and may be imperfect. Output is for static inspection; the workflow does not execute or modify the analyzed DLL.
          EOF

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: acronous-dll-analysis
          path: ${{ steps.input.outputs.output_dir }}/
          if-no-files-found: error
          retention-days: 14

      - name: Commit decompiled output to repository
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.input.outputs.output_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "No changes to decompiled output."
            exit 0
          fi
          git commit -m "Add split Ghidra decompilation output"
          git push origin "HEAD:$GITHUB_REF_NAME"
